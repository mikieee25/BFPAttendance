{% extends "base.html" %}
{% block title %}Edit Attendance{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="d-sm-flex align-items-center justify-content-between mb-4">
    <h1 class="h3 mb-0 text-gray-800">Edit Attendance Record</h1>
    <a
      href="{{ url_for('attendance.index') }}"
      class="d-none d-sm-inline-block btn btn-sm btn-secondary shadow-sm"
    >
      <i class="fas fa-arrow-left fa-sm text-white-50"></i> Back to Attendance
    </a>
  </div>

  <div class="row">
    <div class="col-lg-8 mx-auto">
      <div class="card shadow mb-4">
        <div class="card-header py-3">
          <h6 class="m-0 font-weight-bold text-primary">Update Attendance</h6>
        </div>
        <div class="card-body">
          <form method="POST" action="{{ url_for('attendance.edit', attendance_id=attendance.id) }}">
            <div class="mb-3">
              <label class="form-label">Personnel</label>
              <input
                type="text"
                class="form-control"
                value="{{ attendance.personnel.name_with_rank }}"
                disabled
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Date</label>
              <input
                type="text"
                class="form-control"
                value="{{ attendance.date.strftime('%Y-%m-%d') }}"
                disabled
              />
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="time_in" class="form-label">Time In</label>
                <input
                  type="time"
                  class="form-control"
                  id="time_in"
                  name="time_in"
                  value="{{ attendance.time_in.strftime('%H:%M') if attendance.time_in else '' }}"
                />
              </div>
              <div class="col-md-6 mb-3">
                <label for="time_out" class="form-label">Time Out</label>
                <input
                  type="time"
                  class="form-control"
                  id="time_out"
                  name="time_out"
                  value="{{ attendance.time_out.strftime('%H:%M') if attendance.time_out else '' }}"
                />
              </div>
            </div>

            <div class="mb-3">
              <label for="status" class="form-label">Attendance Status</label>
              <select class="form-select" id="status" name="status" required>
                {% for status in attendance_statuses %}
                <option value="{{ status.value }}" {% if attendance.status and attendance.status.value == status.value %}selected{% endif %}>
                  {{ status.value }}
                </option>
                {% endfor %}
              </select>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i> Save Changes
              </button>
              <a href="{{ url_for('attendance.index') }}" class="btn btn-secondary">
                <i class="fas fa-times me-1"></i> Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
